<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Proof</title>
<!--
  OpenCharities Proof App, mockup for prototype v1 (Apple-style design)
  ---------------------------------------------------------------------
  Decisions from the meeting on 6 Nov 2026 and from the team:
  1. Simple login (no real check, the login is not the focus of the thesis).
  2. Home screen shows the three fixed projects. Tap a project and the camera opens.
  3. On capture: photo + project + GPS + timestamp + name are hashed with SHA-256
     and saved immediately (no preview). Without GPS the proof is blocked.
  4. Everything is stored only locally in this browser (localStorage). No blockchain.
  5. Verify: hash the stored data again and compare with the stored hash.
  6. Deleting is allowed but logged: the entry stays as "deleted", the photo is removed,
     the original hash is kept.

  This is NOT a zero-knowledge proof yet. Whoever verifies needs the original data.
-->
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --fg:#000000; --fg2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.18);
    --fill:rgba(120,120,128,.12); --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
    --bar:rgba(242,242,247,.8);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --fg2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.24); --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --bar:rgba(0,0,0,.75);
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#d9dce3;color:var(--fg);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased}
  @media (prefers-color-scheme: dark){html,body{background:#111}}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

  /* Phone frame on a laptop, full screen on a phone */
  .phone{position:relative;width:390px;height:820px;margin:24px auto;background:var(--bg);border-radius:46px;
         overflow:hidden;box-shadow:0 0 0 11px #1c1c1e,0 30px 80px rgba(0,0,0,.35)}
  @media (max-width:500px){.phone{width:100%;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}}

  /* Screens slide in like iOS navigation */
  .screen{position:absolute;inset:0;overflow-y:auto;background:var(--bg);
          padding:0 0 calc(30px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
  .screen.off{transform:translateX(100%);pointer-events:none}
  .screen.under{transform:translateX(-25%);opacity:.6;pointer-events:none}

  /* Navigation bar */
  .nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
       min-height:44px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;background:var(--bar);
       -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  .nav .mid{font-weight:600;font-size:17px;text-align:center}
  .nav .l{justify-self:start;color:var(--blue);display:flex;align-items:center;gap:2px}
  .nav .r{justify-self:end;color:var(--blue)}
  .nav .l svg{width:12px;height:20px}
  .large{font:700 34px/1.15 var(--display);letter-spacing:.01em;margin:4px 20px 14px}
  .sub{margin:-8px 20px 18px;color:var(--fg2);font-size:15px}

  /* Grouped lists (iOS "inset grouped") */
  .hdr{margin:22px 36px 7px;font-size:13px;text-transform:uppercase;color:var(--fg2);letter-spacing:.02em}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .foot{margin:7px 36px 0;font-size:13px;color:var(--fg2)}
  .cell{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:10px 16px;text-align:left;position:relative}
  .cell + .cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
  .cell:active{background:var(--fill)}
  .cell .txt{flex:1;min-width:0}
  .cell .txt b{display:block;font-weight:400}
  .cell .txt small{display:block;color:var(--fg2);font-size:14px;margin-top:1px}
  .chev{width:8px;height:14px;color:var(--fg2);flex:none;opacity:.7}
  .val{color:var(--fg2);font-size:16px}
  .icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
  .icon svg{width:19px;height:19px}
  .icon.big{width:44px;height:44px;border-radius:10px}
  .icon.big svg{width:26px;height:26px}

  /* Buttons */
  .btn{display:block;width:calc(100% - 32px);margin:0 16px;padding:15px;border-radius:14px;
       background:var(--blue);color:#fff;font-weight:600;font-size:17px;text-align:center}
  .btn:active{opacity:.75}
  .btn.plain{background:var(--card);color:var(--blue)}
  .btn.danger{background:var(--card);color:var(--red)}
  .field{width:100%;border:0;background:none;font:inherit;color:var(--fg);padding:15px 16px;outline:none}

  /* Camera */
  #s-camera{background:#000;color:#fff}
  #s-camera .nav{background:rgba(0,0,0,.4)}
  #s-camera .nav .l,#s-camera .nav .r{color:#fff}
  .viewfinder{position:relative;margin:0;background:#000;aspect-ratio:3/4;width:100%;overflow:hidden}
  .viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
  .chip{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);
        -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px 12px;border-radius:20px;
        font-size:14px;font-weight:600;white-space:nowrap}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .35s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .shutter-row{display:flex;justify-content:center;padding:26px 0 10px}
  .shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
  .shutter i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .12s}
  .shutter:active i{transform:scale(.88)}
  .shutter:disabled{opacity:.35}
  .cam-status{text-align:center;font-size:14px;color:rgba(255,255,255,.75);padding:0 24px;min-height:40px}
  .cam-status.err{color:#ff6961}

  /* Saved */
  .done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px 10px}
  .done .ring{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;
              animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .done .ring svg{width:44px;height:44px;color:#fff}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .done h2{font:700 24px var(--display);margin:18px 0 6px}
  .done p{margin:0;color:var(--fg2);font-size:15px}
  .hash{font:13px/1.4 ui-monospace,"SF Mono",Menlo,monospace;word-break:break-all;color:var(--fg2)}

  /* Overview */
  .thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--fill);flex:none}
  .status{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
  .status svg{width:14px;height:14px}
  .status.ok{background:var(--green)} .status.bad{background:var(--red)}
  .status.none{background:var(--fill);color:var(--fg2);font-size:13px;font-weight:700}
  .deleted .txt b{text-decoration:line-through;color:var(--fg2)}
  .banner{margin:0 16px 4px;padding:13px 16px;border-radius:12px;font-size:15px;display:flex;gap:10px;align-items:center}
  .banner.ok{background:rgba(52,199,89,.15)} .banner.bad{background:rgba(255,59,48,.14)} .banner.info{background:var(--card)}
  .empty{padding:40px 30px;text-align:center;color:var(--fg2)}

  /* Detail */
  .photo{display:block;width:calc(100% - 32px);margin:0 16px;border-radius:12px;background:var(--fill)}
  .kv{display:flex;gap:12px;padding:12px 16px;position:relative;font-size:16px}
  .kv + .kv::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
  .kv span:first-child{color:var(--fg2);width:92px;flex:none}
  .kv span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
  .kv a{color:var(--blue);text-decoration:none}

  /* Square tiles (home and projects) */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 16px 0}
  .tile{aspect-ratio:1/1;background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;
        align-items:flex-start;justify-content:space-between;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .12s}
  .tile:active{transform:scale(.96)}
  .tile .icon.big{width:50px;height:50px;border-radius:12px}
  .tile .icon.big svg{width:28px;height:28px}
  .tile-t{font:600 18px/1.2 var(--display);margin-top:auto}
  .tile-s{font-size:14px;color:var(--fg2);margin-top:3px}

  /* Toast */
  .toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
         background:rgba(30,30,30,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;opacity:0;
         transition:.3s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- 1. Login -->
  <section class="screen" id="s-login">
    <div style="height:calc(80px + env(safe-area-inset-top))"></div>
    <div style="display:flex;justify-content:center;margin-bottom:18px">
      <div class="icon big" style="background:var(--blue);width:76px;height:76px;border-radius:18px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      </div>
    </div>
    <div class="large" style="text-align:center;margin-bottom:6px">Proof</div>
    <p class="sub" style="text-align:center;margin:0 30px 26px">Sign in as NGO staff member.</p>
    <div class="group">
      <input class="field" id="loginName" placeholder="Name" autocomplete="off">
      <div style="border-top:.5px solid var(--sep);margin-left:16px"></div>
      <input class="field" type="password" placeholder="Password">
    </div>
    <p class="foot">Mockup: any name works, the password is not checked. Data stays on this device.</p>
    <div style="height:24px"></div>
    <button class="btn" onclick="login()">Sign In</button>
  </section>

  <!-- 2. Home -->
  <section class="screen off" id="s-home">
    <div class="nav"><span></span><span class="mid"></span><button class="r" onclick="logout()">Sign Out</button></div>
    <div class="large">Proofs</div>
    <p class="sub" id="hello"></p>
    <div class="tiles">
      <button class="tile" onclick="openProjects()">
        <span class="icon big" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
        <span class="tile-t">Proof</span><span class="tile-s">Take a photo</span>
      </button>
      <button class="tile" onclick="verifyAll()">
        <span class="icon big" style="background:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span>
        <span class="tile-t">Verify Proofs</span><span class="tile-s" id="countAll"></span>
      </button>
    </div>
  </section>

  <!-- 2b. Projects -->
  <section class="screen off" id="s-projects">
    <div class="nav"><button class="l" onclick="back()"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>Proofs</button><span class="mid"></span><span></span></div>
    <div class="large">Projects</div>
    <p class="sub">Tap a project to open the camera.</p>
    <div class="tiles" id="projectList"></div>
  </section>

  <!-- 3. Camera -->
  <section class="screen off" id="s-camera">
    <div class="nav"><button class="l" onclick="back()">Cancel</button><span class="mid">Camera</span><span></span></div>
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="chip" id="camProject"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="shutter-row"><button class="shutter" id="shutter" onclick="capture()" aria-label="Take photo" disabled><i></i></button></div>
    <div class="cam-status" id="camMsg"></div>
  </section>

  <!-- 4. Saved -->
  <section class="screen off" id="s-saved">
    <div class="done">
      <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Proof Saved</h2>
      <p>The data was hashed and stored on this device.</p>
    </div>
    <div class="hdr">Details</div>
    <div class="group" id="savedInfo"></div>
    <div style="height:26px"></div>
    <button class="btn" onclick="openCamera(currentProject, true)">Take Another Photo</button>
    <div style="height:10px"></div>
    <button class="btn plain" onclick="goHome()">Done</button>
  </section>

  <!-- 5. Overview -->
  <section class="screen off" id="s-overview">
    <div class="nav"><button class="l" onclick="back()"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>Proofs</button><span class="mid"></span><button class="r" onclick="verifyAll()">Verify All</button></div>
    <div class="large">All Proofs</div>
    <div id="ovMsg"></div>
    <div id="ovList"></div>
  </section>

  <!-- 6. Detail -->
  <section class="screen off" id="s-detail">
    <div class="nav"><button class="l" onclick="back()"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>Back</button><span class="mid">Proof</span><span></span></div>
    <div id="detailBody" style="padding-top:12px"></div>
  </section>

  <div class="toast" id="toast"></div>
</div>
<canvas id="canvas" hidden></canvas>

<script>
/* ---------- 1. Settings and stored data ---------- */

// Projects are fixed in v1 (team decision). Each has a colour and a simple icon.
const PROJECTS = [
  { name: 'Laptops Nepal',         color: '#5856d6', icon: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>' },
  { name: 'School Books Kenya',    color: '#ff9500', icon: '<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/>' },
  { name: 'Water Filters Nigeria', color: '#32ade6', icon: '<path d="M12 3c3.5 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.5 6-11z"/>' }
];

const STORAGE_KEY = 'oc-proofs-v1';
let currentUser = localStorage.getItem('oc-user') || null;
let currentProject = PROJECTS[0].name;
let stream = null;            // the running camera
let stack = [];               // open screens, for the Back button

function loadProofs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
}
function saveProofs(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

/* ---------- 2. Hashing ---------- */

// The exact text that gets hashed. Fixed order (an array): same data, same text, same hash.
function hashInput(p) {
  return JSON.stringify([p.project, p.capturedAt, p.latitude, p.longitude, p.capturedBy, p.photo]);
}
// SHA-256 with the browser's built-in crypto. Returns the hash as hex text.
async function sha256(text) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- 3. Navigation (iOS-style slide) ---------- */

function push(name) {
  const prev = stack[stack.length - 1];
  if (prev) document.getElementById('s-' + prev).classList.add('under');
  const el = document.getElementById('s-' + name);
  el.classList.remove('off', 'under');
  el.scrollTop = 0;
  stack.push(name);
}
function back() {
  const cur = stack.pop();
  if (cur === 'camera') stopCamera();
  if (cur) document.getElementById('s-' + cur).classList.add('off');
  const prev = stack[stack.length - 1];
  if (prev) {
    document.getElementById('s-' + prev).classList.remove('under');
    if (prev === 'home') renderHome();
    if (prev === 'overview') renderOverview();
    if (prev === 'projects') { stack.pop(); openProjects(); }
  }
}
function reset(name) {   // jump straight to a screen without animation history
  stopCamera();
  document.querySelectorAll('.screen').forEach(s => { s.classList.add('off'); s.classList.remove('under'); });
  stack = [];
  push(name);
}
function goHome() { reset('home'); renderHome(); }

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 4. Login and home ---------- */

function login() {
  const name = document.getElementById('loginName').value.trim();
  if (!name) { toast('Please enter a name'); return; }
  currentUser = name;
  localStorage.setItem('oc-user', name);
  goHome();
}
function logout() {
  currentUser = null;
  localStorage.removeItem('oc-user');
  reset('login');
}

const CHEV = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>';

function renderHome() {
  const proofs = loadProofs().filter(p => !p.deleted);
  document.getElementById('hello').textContent = 'Signed in as ' + currentUser;
  document.getElementById('countAll').textContent = proofs.length + ' proof' + (proofs.length === 1 ? '' : 's');
}

// Second screen: the three fixed projects as squares. One tap opens the camera.
function openProjects() {
  const proofs = loadProofs().filter(p => !p.deleted);
  document.getElementById('projectList').innerHTML = PROJECTS.map((p, i) => {
    const n = proofs.filter(x => x.project === p.name).length;
    return `<button class="tile" onclick="openCamera(PROJECTS[${i}].name)">
      <span class="icon big" style="background:${p.color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p.icon}</svg></span>
      <span class="tile-t">${p.name}</span><span class="tile-s">${n} proof${n === 1 ? '' : 's'}</span>
    </button>`;
  }).join('');
  if (stack[stack.length - 1] !== 'projects') push('projects');
}

/* ---------- 5. Taking a proof ---------- */

async function openCamera(project, fromSaved) {
  currentProject = project;
  if (fromSaved) { goHome(); openProjects(); }
  push('camera');
  document.getElementById('camProject').textContent = project;
  const shutter = document.getElementById('shutter');
  const msg = document.getElementById('camMsg');
  shutter.disabled = true;
  msg.className = 'cam-status';
  msg.textContent = 'Starting camera...';
  try {
    // Ask for the camera. On a phone "environment" means the back camera.
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    document.getElementById('video').srcObject = stream;
    shutter.disabled = false;
    msg.textContent = 'Location and time are added when you take the photo.';
  } catch (e) {
    msg.className = 'cam-status err';
    msg.textContent = 'No camera access. Allow the camera for this website and try again.';
  }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('no geolocation')); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}

async function capture() {
  const shutter = document.getElementById('shutter');
  const msg = document.getElementById('camMsg');
  shutter.disabled = true;

  // Step 1: freeze the moment. Time and photo are taken at the tap.
  const capturedAt = new Date().toISOString();
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const scale = Math.min(1, 720 / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const photo = canvas.toDataURL('image/jpeg', 0.7);
  const f = document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');

  // Step 2: location. Without location there is no proof (team decision).
  msg.className = 'cam-status';
  msg.textContent = 'Reading location...';
  let pos;
  try { pos = await getPosition(); }
  catch (e) {
    msg.className = 'cam-status err';
    msg.textContent = 'Proof blocked: no location. Turn on location services and try again. Nothing was saved.';
    shutter.disabled = false;
    return;
  }

  // Step 3: build the data package.
  const proof = {
    id: 'p' + Date.now(),
    project: currentProject,
    capturedAt,
    latitude: Number(pos.coords.latitude.toFixed(6)),
    longitude: Number(pos.coords.longitude.toFixed(6)),
    accuracy: Math.round(pos.coords.accuracy),   // shown, but not part of the hash
    capturedBy: currentUser,
    photo,
    deleted: null,
    lastCheck: null
  };

  // Step 4: hash immediately and store (no preview).
  proof.hash = await sha256(hashInput(proof));
  const list = loadProofs();
  list.unshift(proof);
  try { saveProofs(list); }
  catch (e) {
    msg.className = 'cam-status err';
    msg.textContent = 'Storage is full. Delete old proofs first.';
    shutter.disabled = false;
    return;
  }
  stopCamera();
  document.getElementById('savedInfo').innerHTML = infoRows(proof);
  reset('saved');
}

/* ---------- 6. Verify ---------- */

async function checkProof(p) {
  if (p.deleted) return null;
  const again = await sha256(hashInput(p));
  return { ok: again === p.hash, recomputed: again, at: new Date().toISOString() };
}

async function verifyAll() {
  const list = loadProofs();
  let ok = 0, bad = 0;
  for (const p of list) {
    const r = await checkProof(p);
    if (!r) continue;
    p.lastCheck = r;
    r.ok ? ok++ : bad++;
  }
  saveProofs(list);
  if (stack[stack.length - 1] !== 'overview') push('overview');
  renderOverview();
  const box = document.getElementById('ovMsg');
  const sOk = '<span class="status ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
  const sBad = '<span class="status bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
  if (!ok && !bad) box.innerHTML = '';
  else if (bad) box.innerHTML = `<div class="banner bad">${sBad}<span><b>${bad} changed</b> after saving, ${ok} unchanged.</span></div>`;
  else box.innerHTML = `<div class="banner ok">${sOk}<span><b>${ok === 1 ? 'The proof is' : 'All ' + ok + ' proofs are'} unchanged.</b></span></div>`;
}

/* ---------- 7. Overview and detail ---------- */

function openOverview() { push('overview'); document.getElementById('ovMsg').innerHTML = ''; renderOverview(); }

function statusIcon(p) {
  if (p.deleted || !p.lastCheck) return '<span class="status none">?</span>';
  return p.lastCheck.ok
    ? '<span class="status ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
    : '<span class="status bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
}
function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' +
         d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// Overview grouped by project, like sections in an iOS list.
function renderOverview() {
  const list = loadProofs();
  if (!list.length) { document.getElementById('ovList').innerHTML = '<div class="empty">No proofs yet.<br>Go back and tap a project to take the first one.</div>'; return; }
  document.getElementById('ovList').innerHTML = PROJECTS.map(pr => {
    const items = list.filter(p => p.project === pr.name);
    if (!items.length) return '';
    return `<div class="hdr">${pr.name}</div><div class="group" style="--inset:76px">` + items.map(p => `
      <button class="cell${p.deleted ? ' deleted' : ''}" onclick="openDetail('${p.id}')">
        ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : '<span class="thumb"></span>'}
        <span class="txt"><b>${fmt(p.capturedAt)}</b><small>${p.deleted ? 'Deleted' : !p.lastCheck ? 'Not verified yet' : p.lastCheck.ok ? 'Unchanged' : 'Changed after saving'}</small></span>
        ${statusIcon(p)}${CHEV}
      </button>`).join('') + '</div>';
  }).join('');
}

function infoRows(p) {
  const map = `https://www.openstreetmap.org/?mlat=${p.latitude}&mlon=${p.longitude}#map=16/${p.latitude}/${p.longitude}`;
  return `
    <div class="kv"><span>Project</span><span>${p.project}</span></div>
    <div class="kv"><span>Time</span><span>${fmt(p.capturedAt)}</span></div>
    <div class="kv"><span>Location</span><span>${p.latitude}, ${p.longitude}<br><small style="color:var(--fg2)">about ${p.accuracy} m</small> <a href="${map}" target="_blank" rel="noopener">Show map</a></span></div>
    <div class="kv"><span>Taken by</span><span>${p.capturedBy}</span></div>
    <div class="kv"><span>SHA-256</span><span class="hash">${p.hash}</span></div>`;
}

function openDetail(id) {
  const p = loadProofs().find(x => x.id === id);
  if (!p) return;
  let banner;
  if (p.deleted) banner = `<div class="banner info"><span><b>Deleted</b> on ${fmt(p.deleted.at)} by ${p.deleted.by}.<br>Reason: ${p.deleted.reason || 'none given'}. The photo was removed, the original hash is kept.</span></div>`;
  else if (!p.lastCheck) banner = `<div class="banner info">${statusIcon(p)}<span>Not verified yet.</span></div>`;
  else if (p.lastCheck.ok) banner = `<div class="banner ok">${statusIcon(p)}<span><b>Unchanged.</b> The hash matches.</span></div>`;
  else banner = `<div class="banner bad">${statusIcon(p)}<span><b>Changed after saving.</b> The data no longer gives the stored hash.</span></div>`;

  document.getElementById('detailBody').innerHTML = `
    ${banner}
    ${p.photo ? `<div style="height:12px"></div><img class="photo" src="${p.photo}" alt="Proof photo">` : ''}
    <div class="hdr">Details</div>
    <div class="group">${infoRows(p)}
      ${p.lastCheck && !p.lastCheck.ok ? `<div class="kv"><span>Hash now</span><span class="hash" style="color:var(--red)">${p.lastCheck.recomputed}</span></div>` : ''}
    </div>
    ${p.deleted ? '' : `
      <div style="height:26px"></div>
      <button class="btn" onclick="verifyOne('${p.id}')">Verify This Proof</button>
      <div class="hdr">Demo</div>
      <div class="group"><button class="cell" style="color:var(--orange)" onclick="tamper('${p.id}')"><span class="txt"><b>Change Time by 1 Minute</b></span></button></div>
      <p class="foot">For the presentation: changes the stored time without a new hash. Verify afterwards to see the cross.</p>
      <div style="height:22px"></div>
      <button class="btn danger" onclick="deleteProof('${p.id}')">Delete Proof</button>
      <p class="foot">Deleting is logged. The entry stays visible as deleted.</p>`}`;
  if (stack[stack.length - 1] !== 'detail') push('detail');
}

async function verifyOne(id) {
  const list = loadProofs();
  const p = list.find(x => x.id === id);
  p.lastCheck = await checkProof(p);
  saveProofs(list);
  openDetail(id);
  toast(p.lastCheck.ok ? 'Unchanged' : 'Changed after saving');
}

// Deleting is logged: keep the entry, remove the photo, keep the original hash.
function deleteProof(id) {
  const reason = prompt('Why is this proof deleted? (e.g. blurry photo)');
  if (reason === null) return;
  const list = loadProofs();
  const p = list.find(x => x.id === id);
  p.deleted = { at: new Date().toISOString(), by: currentUser, reason: reason.trim() };
  p.photo = null;
  p.lastCheck = null;
  saveProofs(list);
  openDetail(id);
  toast('Proof deleted');
}

// Demo only: change the data afterwards WITHOUT making a new hash.
function tamper(id) {
  const list = loadProofs();
  const p = list.find(x => x.id === id);
  p.capturedAt = new Date(new Date(p.capturedAt).getTime() + 60000).toISOString();
  p.lastCheck = null;
  saveProofs(list);
  openDetail(id);
  toast('Time changed by 1 minute');
}

/* ---------- 8. Start ---------- */
if (currentUser) goHome(); else reset('login');
document.getElementById('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// Camera, location and SHA-256 only work on a secure page (https:// or a local file on a laptop).
if (!window.isSecureContext) alert('This page is not opened via https://. Camera, location and hashing will not work.');
</script>
</body>
